<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0d12" />
    <title>404 · 水鱼 Blog</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --text: #f2f5fa;
        --muted: #9aa5b5;
        --accent: #4cc2ff;
        --stroke: rgba(255, 255, 255, 0.12);
      }
      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #f1f3f7;
        --text: #16171c;
        --muted: #5c6472;
        --accent: #0078d4;
        --stroke: rgba(15, 23, 36, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        background:
          radial-gradient(80% 60% at 20% 0%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      }
      .card {
        width: min(560px, 100%);
        padding: clamp(24px, 6vw, 48px);
        border: 1px solid var(--stroke);
        border-radius: 18px;
        background: color-mix(in srgb, var(--bg) 72%, transparent);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(22px);
      }
      .logo { width: 48px; height: 48px; border-radius: 10px; }
      .eyebrow { margin: 20px 0 6px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: 0.18em; }
      h1 { margin: 0 0 10px; font-size: clamp(40px, 9vw, 76px); letter-spacing: -0.05em; line-height: 1; }
      p { margin: 0 0 22px; color: var(--muted); line-height: 1.8; font-size: 14px; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; }
      a {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 40px;
        padding: 0 16px;
        border: 1px solid var(--stroke);
        border-radius: 8px;
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }
      a.primary { border-color: transparent; background: var(--accent); color: #08111a; }
      a:hover { border-color: var(--accent); }
    </style>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('whwdzg-site-settings-v3') || '{}') || {};
        var t = s.theme;
        if (!t) {
          var l = localStorage.getItem('setting-lightdarktoggle');
          t = l === '1' ? 'light' : l === '2' ? 'dark' : 'system';
        }
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/icons/logo-192.png" alt="" width="48" height="48" />
      <p class="eyebrow">404 · NOT FOUND</p>
      <h1>这一页不存在</h1>
      <p>链接可能来自旧版本，或者只是一个拼写错误。3.0 的页面只有主页、影像存档、留言板、GitHub 评论区与关于。</p>
      <div class="actions">
        <a class="primary" href="/">回到主页</a>
        <a href="/bilibili/">看看影像归档</a>
        <a href="/comments/github/">GitHub 评论区</a>
        <a href="/about/">关于本站</a>
      </div>
    </main>
  </body>
</html>
